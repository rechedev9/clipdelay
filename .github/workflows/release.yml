name: Release

# A v* tag builds the plugin from that commit, attests the zip and publishes the release.
# A manual run builds the same zip as a workflow artifact and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    # windows-2025 no longer ships Visual Studio 2022, which the windows-x64 CMake preset needs.
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Go checks
        run: |
          # A non-zero exit from a native command fails the step, not only the last one.
          $PSNativeCommandUseErrorActionPreference = $true
          go vet ./...
          go test -race ./...

      - name: Build the plugin
        working-directory: obs-plugin
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --preset windows-ci-x64
          cmake --build --preset windows-ci-x64
          cmake --install build_x64 --config RelWithDebInfo --prefix "$env:RUNNER_TEMP\out"

      - name: Package
        id: package
        run: |
          $version = (Get-Content obs-plugin/buildspec.json | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match buildspec version $version"
          }
          $zip = "clipdelay-$version-windows-x64.zip"
          Get-ChildItem "$env:RUNNER_TEMP\out\clipdelay" -Recurse -Filter *.pdb | Remove-Item
          Compress-Archive -Path "$env:RUNNER_TEMP\out\clipdelay" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii -NoNewline SHA256SUMS.txt
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/attest-build-provenance@v3
        if: github.ref_type == 'tag'
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - uses: actions/upload-artifact@v4
        with:
          name: clipdelay-windows-x64
          path: |
            ${{ steps.package.outputs.zip }}
            SHA256SUMS.txt

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.package.outputs.zip }}" SHA256SUMS.txt `
            --title "ClipDelay ${{ github.ref_name }}" --generate-notes --verify-tag
